listen_addr: ":2525"
submission_addr: ":587"
# Optional implicit TLS Submission (TLS before SMTP greeting).
submission_tls_addr: "" # e.g. ":465"
submission_allow_insecure_auth: false # isolated testing only
submission_auth_required: true
submission_users: "alice@example.com:s3cr3t"
submission_auth_backend: static
submission_auth_dsn: ""
submission_enforce_sender_identity: true
log_level: info
observability_addr: ":9090"
otel_enabled: false
otel_service_name: kuroshio-mta
otel_service_version: ""
otel_exporter_otlp_endpoint: http://localhost:4318/v1/traces
otel_exporter_otlp_insecure: true
otel_trace_sample_ratio: 1.0
admin_addr: ":8080"
admin_tokens: "sha256=d036bd6d01a1cae081d39a2f8dab751dc042de814fd60df31fcb553170950f29:viewer,sha256=0850123315d21ab90f4f7236408a52ef6dbd6a02a6550e5c10dc73f4d993680e:operator"
admin_auth_backend: config
admin_auth_dsn: ""
hostname: kuroshio.local
queue_dir: ./var/queue
queue_backend: local
kafka_brokers:
  - localhost:9092
kafka_consumer_group: kuroshio-mta
kafka_topic_inbound: mail.inbound
kafka_topic_retry: mail.retry
kafka_topic_dlq: mail.dlq
kafka_topic_sent: mail.sent
tls_cert_file: ./certs/tls.crt
tls_key_file: ./certs/tls.key
ingress_rate_limit_per_minute: 100
rate_limit_backend: memory
rate_limit_rules: "connect:ip:100:1m"
rate_limit_redis_addrs:
  - localhost:6379
rate_limit_redis_db: 0
rate_limit_redis_key_prefix: kuroshio:ratelimit
dnsbl_zones:
  - zen.spamhaus.org
dnsbl_cache_ttl: 5m
# Optional process-local MX/address cache. TTLs are operator-defined because
# Go's system resolver does not expose authoritative DNS TTLs.
dns_cache_enabled: false
dns_cache_positive_ttl: 1m
dns_cache_negative_ttl: 30s
dns_cache_capacity: 10000
dane_dnssec_trust_model: ad_required
mta_sts_cache_ttl: 1h
mta_sts_fetch_timeout: 5s
delivery_mode: mx
spool_backend: local
local_spool_dir: ./var/spool
spool_s3_bucket: mail-spool
spool_s3_prefix: outbound
spool_s3_endpoint: http://localhost:9000
spool_s3_region: us-east-1
spool_s3_access_key: minioadmin
spool_s3_secret_key: minioadmin
spool_s3_force_path_style: true
spool_s3_use_tls: false
relay_host: smtp.relay.local
relay_port: 587
relay_require_tls: true
# Named routes are checked from top to bottom before delivery_mode fallback.
# Keep relay credentials in a 0600 file; authenticated routes require STARTTLS.
# delivery_routes:
#   - name: internal-relay
#     domains:
#       - corp.example
#     mode: relay
#     relay_host: smtp.internal.example
#     relay_port: 587
#     relay_require_tls: true
#     relay_username: kuroshio
#     relay_password_file: /run/secrets/internal-relay-password
#     egress_pool: transactional
#   - name: archive-spool
#     domains:
#       - archive.example
#     mode: local_spool
#   - name: dovecot-mailstore
#     domains:
#       - mailbox.example
#     mode: lmtp
#     lmtp_unix_socket: /run/dovecot/lmtp
# Egress source IPs must already be assigned to this host. Limits reset at UTC midnight.
# egress_sources:
#   - name: primary
#     ip: 192.0.2.10
#     ehlo: mail.example.com
#     weight: 4
#     daily_limit: 10000
#     stopped: false
#   - name: warmup
#     ip: 192.0.2.11
#     ehlo: warmup.example.com
#     weight: 1
#     daily_limit: 1000
# egress_pools:
#   - name: transactional
#     sources: [primary, warmup]
# egress_tenant_pools:
#   alice@example.com: transactional
max_message_bytes: 10485760
worker_count: 4
queue_fairness:
  enabled: false
  prefetch_factor: 8
  max_tenants: 1024
  tenant_max_per_batch: 0
  class_weights: {transactional: 4, bulk: 1, system: 1, default: 1}
  class_max_per_batch: {}
  tenant_classes: {}
max_attempts: 12
max_retry_age: 120h
retry_schedule:
  - 5m
  - 30m
  - 2h
  - 6h
  - 24h
scan_interval: 5s
dial_timeout: 8s
send_timeout: 20s

# Opt-in outbound SMTP connection reuse. Connections are never shared across
# destination, source IP/EHLO, relay auth identity, or TLS/DANE policy keys.
smtp_connection_pool:
  enabled: false
  max_connections: 64
  max_connections_per_key: 4
  max_idle: 32
  max_idle_per_key: 2
  idle_timeout: 30s
  max_lifetime: 5m
  max_deliveries: 100
# Multi-domain profiles are an alternative to the following three legacy settings.
# dkim_profiles_file: /etc/kuroshio/signing-profiles.json
dkim_sign_domain: example.com
dkim_sign_selector: default
# RSA (PKCS#1 / PKCS#8 PEM) または Ed25519 (PKCS#8 PEM)。DKIM/ARC 共用。
dkim_private_key_file: ./keys/dkim.pem
dkim_sign_headers: from:to:subject:date:message-id
arc_failure_policy: accept
spf_helo_policy: advisory
spf_mailfrom_policy: advisory
dmarc_policy_mode: shadow
domain_max_concurrent_default: 8
domain_max_concurrent_rules: "gmail.com:2,yahoo.com:1"
domain_throttle_backend: memory
domain_throttle_redis_addrs:
  - localhost:6379
domain_throttle_redis_db: 0
domain_throttle_redis_key_prefix: kuroshio:domainthrottle
domain_adaptive_throttle: true
domain_tempfail_threshold: 0.3
domain_penalty_max: 5s
# SMTP response-based automatic holds. Start in dry-run and use narrowly
# scoped, provider-confirmed response rules.
response_throttle:
  enabled: false
  dry_run: true
  rules:
    - id: example-rate-limit
      domains: ["example.net"]
      smtp_code: 421
      enhanced_status: "4.7.0"
      stage: greeting
      threshold: 5
      window: 1m
      pause: 10m
data_retention_sent: 720h
data_retention_dlq: 2160h
data_retention_poison: 4320h
retention_sweep_interval: 1h
reputation_start_date: "2026-01-01"
reputation_warmup_rules: "0:100,7:1000,14:5000"
reputation_bounce_threshold: 0.05
reputation_complaint_threshold: 0.001
reputation_min_samples: 100

# Optional RFC 7662 access-token validation (enables XOAUTH2 after STARTTLS).
# Configure TLS certificate/key and a trusted IdP before enabling this URL.
submission_bearer_introspection_url: ""
submission_bearer_client_id: ""
# Prefer MTA_SUBMISSION_BEARER_CLIENT_SECRET_FILE for production secrets.
submission_bearer_client_secret: ""
submission_bearer_issuer: ""
submission_bearer_audience: ""
submission_bearer_username_claim: sub
submission_bearer_required_scope: smtp.send

# Local queue admission quotas (0 disables each limit; Kafka rejects enabled quotas).
queue_max_messages: 0
# Pending message Data bytes, including injected headers; excludes JSON overhead.
queue_max_bytes: 0
# Resume below this percentage of each enabled quota (0 uses 80%).
queue_low_watermark_percent: 80
# Keep this many filesystem bytes available after the incoming JSON write.
queue_min_free_bytes: 0

# SMTP delivery failure classification is always enabled (no extra setting).
# Automatic suppression: permanent RCPT 5.1.1 only. DATA policy rejections,
# auth/TLS failures, mailbox-full and unknown 5xx do not suppress recipients.
# Existing suppression entries remain unchanged; see docs/runbooks/admin_api.md.

# Optional MX/provider-group shaping for SMTP delivery (mx or relay).
# Existing domain limits remain additional constraints. Nested options use YAML.
mx_shaping:
  enabled: false
  backend: memory # memory or redis; redis uses domain_throttle_redis_* credentials
  cache_ttl: 0s # operator MX snapshot TTL; 0 disables application caching
  retry_delay: 1s # minimum reschedule delay, not a worker sleep
  default:
    messages_per_minute: 0 # recipient delivery attempts; 0 = unlimited
    message_burst: 1
    connections_per_minute: 0 # TCP dial attempts including alternate MX hosts
    connection_burst: 1
    max_connections: 0 # in-flight TCP attempts/sessions; 0 = unlimited
  providers: []
  # - name: shared-provider
  #   domains: [customer-a.example, customer-b.example]
  #   mx_suffixes: [mx.provider.example]
  #   limits: # full replacement for default; omitted limit fields are unlimited
  #     messages_per_minute: 60
  #     message_burst: 5
  #     connections_per_minute: 30
  #     connection_burst: 2
  #     max_connections: 2

# Optional independent kuroshio.smtp-policy.v1 HTTP policy API; not Stalwart MTA Hooks.
# Empty URL disables it. Only RCPT and DATA-complete/pre-enqueue are supported.
policy_hook:
  url: ""
  timeout: 5s
  max_concurrent: 32
  max_response_bytes: 65536
  send_body: false # explicit opt-in to send final message bytes as base64
  token_file: "" # Bearer token file; MTA_POLICY_HOOK_TOKEN_FILE can override
  allow_http_loopback: false # tutorial-only exception for literal loopback IPs

# Recipient admission is independent of delivery_mode; no relay CIDR is trusted by default.
inbound_policy:
  local_domains: [example.com]
  local_recipients: [postmaster@example.com, user@example.com]
  trusted_cidrs: [] # e.g. a narrowly scoped internal submission network

# Dedicated PROXY v2 listeners: enable only behind trusted TCP load balancers.
# Enabled listeners require a PROXY v2 header before SMTP or TLS bytes.
proxy_protocol:
  smtp: false
  submission: false
  submission_tls: false
  trusted_cidrs: []

# Receiving resource limits, independently enforced by each listener.
# Zero or omitted values use these defaults; negative values are rejected.
smtp_limits:
  max_connections: 1024
  max_connections_per_ip: 32
  max_recipients: 100
  max_messages: 100
  max_bytes: 104857600
  max_auth_failures: 5
  max_rcpt_failures: 20
  idle_timeout: 5m
  max_lifetime: 10m

# Opt-in local policy isolation; disabled mode keeps auth quarantine header-only.
# Kafka is unsupported and rejected when enabled. Expired holds are deleted.
quarantine:
  enabled: false
  retention: 168h

# Operator domain pause/resume. local state belongs to one process;
# use redis with shared domain_throttle_redis_* settings for multiple nodes.
delivery_pause:
  enabled: false
  backend: local
