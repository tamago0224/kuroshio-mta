listen_addr: ":2525"
submission_addr: ":587"
submission_auth_required: true
# Isolated local tutorial only; production requires TLS.
submission_allow_insecure_auth: true
submission_auth_backend: sqlite
submission_auth_dsn: "file:/var/lib/kuroshio/submission-auth.db"
submission_enforce_sender_identity: true
hostname: tutorial.local
queue_dir: /var/lib/kuroshio/queue
log_level: info
observability_addr: ":9090"

# Isolated tutorial clients only. Adjust to the actual Docker bridge subnet.
# Never trust this broad Docker range on an externally reachable deployment.
inbound_policy:
  trusted_cidrs: [127.0.0.0/8, '::1/128', 172.16.0.0/12]
