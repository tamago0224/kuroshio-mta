listen_addr: "127.0.0.1:2525"
observability_addr: "127.0.0.1:9090"
hostname: kuroshio.local
queue_dir: ./var/policy-hook-queue
queue_backend: local
delivery_mode: local_spool
spool_backend: local
local_spool_dir: ./var/policy-hook-spool
policy_hook:
  url: http://127.0.0.1:9081/policy
  allow_http_loopback: true # local tutorial only; production uses HTTPS
  timeout: 2s
  max_concurrent: 4
  max_response_bytes: 4096
  send_body: false

# Isolated tutorial clients only. Adjust to the actual Docker bridge subnet.
# Never trust this broad Docker range on an externally reachable deployment.
inbound_policy:
  trusted_cidrs: [127.0.0.0/8, '::1/128', 172.16.0.0/12]
