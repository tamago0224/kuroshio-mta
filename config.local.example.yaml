# Local smoke test: receive SMTP and store mail without external delivery.
listen_addr: "127.0.0.1:2525"
observability_addr: "127.0.0.1:9090"
hostname: kuroshio.local
queue_dir: ./var/queue
queue_backend: local
delivery_mode: local_spool
spool_backend: local
local_spool_dir: ./var/spool

# Accept only these local test recipients; do not grant unauthenticated relay.
inbound_policy:
  local_domains: [recipient.test]
  local_recipients: [user@recipient.test]
  trusted_cidrs: []
