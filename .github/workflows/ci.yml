name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test / Vet / Race
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true

      - name: Go Version
        run: go version

      - name: Download Dependencies
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      - name: Unit Tests
        run: go test ./...

      - name: Race Tests
        run: go test -race ./...

      - name: Configuration Reload Process
        run: go test -race -tags=integration ./cmd/kuroshio -run '^TestConfigReloadProcess$' -count=1 -v

      - name: PROXY v2 Loopback LB
        run: go test -race -tags=integration ./internal/smtp -run '^TestProxyV2LoopbackLB$' -count=1 -v

  smtp-conformance:
    name: SMTP Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: SMTP Conformance (RFC section trace)
        run: go test ./internal/smtp -run '^TestSMTPConformance$' -v

  delivery-pause-redis:
    name: Delivery Pause Redis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
      - name: Shared domain pause integration
        env:
          MTA_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -tags=integration ./internal/deliverypause -run '^TestRedisPause' -count=1 -v
